name: Windows Installer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows.yml'
      - 'package*.json'
      - 'main.js'
      - 'preload.js'
      - 'src/**'
      - '*.svg'
      - 'app_icon.png'
      - 'windows-smoke.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build Windows installer
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test packaged application
        run: npm run test:windows
      - name: Save build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/*.exe
            dist/windows-smoke.png
          if-no-files-found: ignore
      - name: Publish Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version-windows"
          $notes = "Windows x64 installer. Unsigned build. Application data stays on your computer."
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "VJOBE Community $version for Windows" --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "Could not create release" }
          }
          $installer = Get-ChildItem dist/VJOBE-Community-Setup-*.exe
          if ($installer.Count -ne 1) { throw "Expected exactly one installer" }
          gh release upload $tag $installer.FullName --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload installer" }
